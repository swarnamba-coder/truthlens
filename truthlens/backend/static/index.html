<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>TruthLens — Forensic Intelligence Platform</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080D18;--side:#0C1423;--s2:#111C2D;--s3:#162238;--ac:#38BDF8;--ac2:#818CF8;--tx:#F1F5F9;--mu:#94A3B8;--ok:#34D399;--wa:#FBBF24;--cr:#FB7185;--bd:#22304a;--pu:#C084FC}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,sans-serif}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.app{display:flex;min-height:100vh}
aside{width:224px;background:var(--side);border-right:1px solid var(--bd);padding:16px 10px;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto}
aside.c{width:60px}aside.c .lb{display:none}
.logo{font-weight:700;letter-spacing:.05em;padding:4px 10px 16px;display:flex;gap:8px;align-items:center}.logo i{width:14px;height:14px;border:2px solid var(--ac);border-radius:50%;flex:none}
.nav a{display:flex;gap:10px;padding:9px 10px;border-radius:6px;color:var(--mu);margin-bottom:2px}.nav a:hover{background:var(--s2)}.nav a.on{background:var(--s3);color:var(--tx);box-shadow:inset 2px 0 var(--ac)}
main{flex:1;min-width:0}
header.top{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--bd);background:var(--side);position:sticky;top:0;z-index:5}
.sp{flex:1}.pill{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.pill.ok{color:var(--ok);border-color:var(--ok);background:rgba(52,211,153,.1)}.pill.er{color:var(--cr);border-color:var(--cr);background:rgba(251,113,133,.1)}
.pill.demo{color:var(--wa);border-color:var(--wa);background:rgba(251,191,36,.12)}.pill.info{color:var(--ac);border-color:var(--ac);background:rgba(56,189,248,.1)}
.pill.pu{color:var(--pu);border-color:var(--pu);background:rgba(192,132,252,.1)}.pill.wa{color:var(--wa);border-color:var(--wa);background:rgba(251,191,36,.12)}
.btn{background:var(--s3);border:1px solid var(--bd);border-radius:6px;padding:8px 14px;min-height:36px;color:var(--tx);font-weight:500}.btn:hover{border-color:var(--ac)}
.btn.p{background:var(--ac);color:#04121c;border-color:var(--ac);font-weight:600}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:4px 9px;min-height:28px;font-size:12px}.btn.ok{background:rgba(52,211,153,.15);border-color:var(--ok);color:var(--ok)}
.btn.er{background:rgba(251,113,133,.15);border-color:var(--cr);color:var(--cr)}.btn.wa{background:rgba(251,191,36,.15);border-color:var(--wa);color:var(--wa)}
.pg{padding:24px 20px;max-width:1200px}h1{font-size:22px;margin:0 0 6px}h2{font-size:15px;margin:0 0 10px}.mu{color:var(--mu)}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:16px}
.kpi b{font-size:26px;display:block;margin-top:4px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.drop{border:1px dashed #35507a;border-radius:8px;padding:14px;background:var(--bg)}.drop.over{border-color:var(--ac);background:var(--s3)}
.file{display:flex;gap:8px;align-items:center;padding:6px 0;font-size:13px;border-top:1px solid var(--bd);margin-top:6px}.file span:first-child{flex:1;overflow:hidden;text-overflow:ellipsis}
.err{color:var(--cr);font-size:13px;margin-top:6px}
input[type=text],textarea,select{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:9px;color:var(--tx);font:inherit}
label{display:block;color:var(--mu);margin:10px 0 4px;font-size:13px}
.hero{padding:54px 20px 36px;max-width:920px;margin:auto}.hero h1{font-size:clamp(32px,5vw,48px);line-height:1.15;letter-spacing:-.02em}
.lnav{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--bd)}
.note{border-left:3px solid var(--ac);background:var(--s2);padding:12px 14px;border-radius:0 6px 6px 0}
.tl{position:relative;margin-left:70px;border-left:2px solid var(--bd)}
.ev{position:relative;padding:0 0 16px 18px}.ev time{position:absolute;left:-76px;width:60px;text-align:right;color:var(--ac);font-variant-numeric:tabular-nums;font-weight:600}
.ev:before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--c,var(--ac))}
.tag{font-size:11px;padding:2px 7px;border-radius:4px;border:1px solid var(--c,var(--bd));color:var(--c,var(--mu));margin-right:6px;font-weight:600;display:inline-block}
.bar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.empty{text-align:center;padding:40px 16px;color:var(--mu)}
.code-box{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:10px 12px;font-family:monospace;font-size:12px;overflow-x:auto}
.review-banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:8px;border:1px solid var(--bd);margin-bottom:16px;flex-wrap:wrap}
.waveform-bar{display:flex;align-items:flex-end;gap:1px;height:48px;overflow:hidden}
.waveform-bar span{background:var(--ac);border-radius:1px;min-width:2px;opacity:.7}
@media(max-width:760px){aside{position:fixed;z-index:9;transform:translateX(-100%);transition:transform .2s}aside.open{transform:none;width:224px}aside.open .lb{display:inline}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="root"></div>
<script>
const API_BASE=(window.TRUTHLENS_API_BASE||location.origin)+'/api/v1';
async function api(path,opt={},ms=15000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
 try{const r=await fetch(API_BASE+path,{...opt,signal:c.signal});if(!r.ok)throw new Error('Backend returned HTTP '+r.status);return await r.json()}
 catch(e){throw new Error(e.name==='AbortError'?'Request timed out':e.message==='Failed to fetch'?'Cannot reach TruthLens API at '+API_BASE:e.message)}finally{clearTimeout(t)}}

const S={collapsed:false,open:false,files:{image:[],video:[],audio:[],text:[]},errs:{},conn:'checking',inv:null,toast:'',tab:'image',list:null,res:null,st:null,ev:[],sk:'date',p:0,q:'',f:'',src:''};
const TYPES={image:{l:'Image evidence',ext:['jpg','jpeg','png','webp','tiff','bmp']},video:{l:'Video evidence',ext:['mp4','mov','webm','avi','mkv']},audio:{l:'Audio evidence',ext:['wav','mp3','m4a','flac','ogg']},text:{l:'Text & Documents',ext:['txt','md','docx','pdf']}};
const NAV=[
 ['overview','Overview'],
 ['new','New Investigation'],
 ['history','Investigations'],
 ['evidence','Evidence Workspace'],
 ['correlation','Correlation'],
 ['report','Reports'],
 ['registry','Model Registry'],
 ['settings','Settings']
];

const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const size=b=>b>1e6?(b/1e6).toFixed(1)+' MB':Math.max(1,Math.round(b/1e3))+' KB';
const fmt=s=>{const n=Math.floor(s||0);return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')};
const route=()=>location.hash.slice(1)||'home';

// Provenance tier display info
const PV={
 observed:['OBSERVED METADATA','--mu','Direct cryptographic or file stream property'],
 heuristic:['HEURISTIC INDICATOR','--ac','Mathematical signal anomaly (outlier metric)'],
 model_prediction:['MODEL PREDICTION','--ac2','Machine learning classifier inference'],
 ai_explanation:['AI EXPLANATION','--wa','Plain-language examiner synthesis']
};

// Review status display
const RS={
 not_reviewed:{label:'Not Reviewed',cls:''},
 not_started:{label:'Not Started',cls:''},
 confirmed:{label:'Confirmed',cls:'ok'},
 dismissed:{label:'Dismissed (Benign)',cls:'er'},
 needs_review:{label:'Needs Review',cls:'wa'},
 in_progress:{label:'Review In Progress',cls:'info'},
 reviewed:{label:'Reviewed ✓',cls:'ok'}
};

const EVU=(i,f)=>`${API_BASE}/investigations/${i}/evidence/${f}`;
const ART=(inv,p)=>p?p.startsWith('/')?p:`${API_BASE}/investigations/${inv}/artifacts/${p}`:'';

let poll=null;
function stopPoll(){if(poll){clearInterval(poll);poll=null}}
function startPoll(){stopPoll();poll=setInterval(async()=>{await loadRes();if(S.st&&['completed','failed'].includes(S.st.status))stopPoll()},2500)}

async function ping(){S.conn='checking';render();try{S.health=await api('/health',{},5000);S.conn='ok'}catch(e){S.conn='down';S.connMsg=e.message}render();onRoute()}
function toast(m,ms=3500){S.toast=m;render();setTimeout(()=>{S.toast='';render()},ms)}

async function loadList(){try{S.list=await api('/investigations');S.lerr=''}catch(e){S.lerr=e.message}render()}
async function loadRes(){
 if(!S.inv)return;
 try{
   S.st=await api(`/investigations/${S.inv}/status`);
   const r=await api(`/investigations/${S.inv}/results`);
   S.res=r.results;S.ev=r.evidence;S.rerr='';
 }catch(e){S.rerr=e.message}
 render()
}
async function loadRegistry(){try{const r=await api('/registry');S.registry=r.registry}catch(e){S.regErr=e.message}render()}

function openInv(id,pg){S.inv=id;S.res=null;S.st=null;S.tab='image';location.hash=pg}
async function dl(){
 try{
   toast('Generating PDF report…',8000);
   const r=await fetch(API_BASE+`/investigations/${S.inv}/report`);
   if(!r.ok)throw new Error('PDF not ready ('+r.status+')');
   const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download=S.inv+'-report.pdf';a.click();
   toast('PDF downloaded')
 }catch(e){toast('Error: '+e.message)}
}

// Finding-level review
async function rev(id,s){
 try{
   await api(`/investigations/${S.inv}/findings/${id}/review`,{method:'PATCH',headers:{"Content-Type":"application/json"},body:JSON.stringify({review_status:s})});
   await loadRes();await loadList();toast('Finding marked as '+s.replace(/_/g,' '))
 }catch(e){toast('Error: '+e.message)}
}
// Case-level sign-off
async function setCaseReview(s,notes){
 try{
   const body={review_status:s};if(notes)body.examiner_notes=notes;
   await api(`/investigations/${S.inv}/review`,{method:'PATCH',headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
   await loadList();await loadRes();toast('Case signed off as: '+s.replace(/_/g,' '))
 }catch(e){toast('Error: '+e.message)}
}
// Re-run analysis
async function reAnalyze(){
 if(!S.inv)return;
 if(!confirm('Re-run forensic analysis on this case? This replaces current findings.'))return;
 try{
   toast('Re-running analysis…',8000);
   await api(`/investigations/${S.inv}/analyze`,{method:'POST'});
   location.hash='progress';startPoll();toast('Analysis re-started')
 }catch(e){toast('Error: '+e.message)}
}

function onRoute(){const r=route();if(S.conn!=='ok')return;if(r==='overview'||r==='history')loadList();if(r==='registry')loadRegistry();if(S.inv&&['evidence','correlation','report'].includes(r))loadRes();if(r==='progress'&&S.inv){loadRes();startPoll()}}

// ── LANDING ──────────────────────────────────────────────────────────────────
function landing(){return `<div class="lnav"><b class="logo" style="padding:0"><i></i>TRUTHLENS</b><span class="sp"></span><a class="btn" href="#overview">Open workspace</a></div>
<section class="hero"><p class="mu" style="font-weight:600;letter-spacing:.05em;text-transform:uppercase">Digital Truth. Forensic Intelligence.</p>
<h1>See beyond what appears real.</h1>
<p class="mu" style="max-width:62ch;font-size:16px;margin:16px 0 24px">TruthLens examines images, video, audio, and documents for manipulation indicators across modalities, then assembles findings into a court-ready investigation report with full examiner review workflow.</p>
<p><a class="btn p" href="#overview">Explore Demo Cases</a> <a class="btn" href="#new" style="margin-left:8px">Start Real-Time Analysis</a> <a class="btn" href="#registry" style="margin-left:8px">Model Governance</a></p></section>
<section class="hero" style="padding-top:10px"><div class="grid g3">
<div class="card"><h2>Image Forensics</h2><p class="mu">ExifTool metadata, OpenCV sharpness variance, C2PA Content Credentials check, and TruFor-evaluated ELA re-compression heatmaps.</p></div>
<div class="card"><h2>Video Forensics</h2><p class="mu">FFmpeg keyframe extraction, frame-by-frame pixel-delta analysis with timestamps, GenConViT-evaluated discontinuity detection.</p></div>
<div class="card"><h2>Audio Anti-Spoofing</h2><p class="mu">Librosa STFT spectrogram, AASIST-evaluated spectral flatness heuristics, Faster-Whisper CPU transcription with clickable segments.</p></div>
<div class="card"><h2>Examiner Review Workflow</h2><p class="mu">5-stage review status: Pending → Analysis Complete → Human Review Pending → In Progress → Reviewed. Human sign-off required before report finalisation.</p></div>
<div class="card"><h2>Cross-Modal Correlation</h2><p class="mu">Unified chronological timeline aligning video, audio and text anomalies by timestamp within configurable proximity windows.</p></div>
<div class="card"><h2>Court-Ready Reports</h2><p class="mu">ReportLab PDF dossiers with SHA-256 chain, raw metrics, alternative benign explanations, and model governance table.</p></div>
</div>
<div class="card" style="margin-top:24px;border-left:4px solid var(--ac)">
<b>Scientific Forensic Principle:</b> TruthLens never fabricates or calculates a combined "authenticity percentage". Every finding preserves its raw detector score, forensic limitations, and alternative benign explanations. A result marked <b>Not Reviewed</b> means analysis is complete but awaiting human examiner sign-off — it does NOT mean the file is fake or the analysis failed.
</div></section>`}

// ── OVERVIEW ─────────────────────────────────────────────────────────────────
function overview(){
 const h='<h1>Investigation Overview</h1><p class="mu">Forensic platform status and active investigations registry.</p>';
 if(S.conn==='down')return h+`<div class="card empty"><b style="color:var(--cr)">Backend not reachable at ${esc(API_BASE)}</b><p class="mu">Make sure the Docker container is running: <code>docker compose up -d</code></p><button class="btn" onclick="ping()">Retry connection</button></div>`;
 if(!S.list)return h+'<p class="mu">Loading investigations…</p>';
 const L=S.list,demos=L.filter(i=>i.is_demo),live=L.filter(i=>!i.is_demo);
 const nf=L.reduce((n,i)=>n+(i.evidence||[]).length,0);
 const needsReview=L.filter(i=>i.review_status==='needs_review'||i.review_status==='not_started').length;
 return h+`
<div class="grid g4" style="margin:16px 0">
 <div class="card kpi"><span class="mu">Pre-Seeded Demo Cases</span><b>${demos.length} Available</b><span class="pill demo" style="margin-top:6px;display:inline-block">Interactive Samples</span></div>
 <div class="card kpi"><span class="mu">Live Investigations</span><b>${live.length} Executed</b><span class="pill ok" style="margin-top:6px;display:inline-block">Real-Time Data</span></div>
 <div class="card kpi"><span class="mu">Evidence Files Indexed</span><b>${nf} Files</b><span class="mu" style="font-size:12px;display:block">SHA-256 Verified</span></div>
 <div class="card kpi"><span class="mu">Awaiting Examiner Review</span><b>${needsReview} Cases</b><span class="pill wa" style="margin-top:6px;display:inline-block">Action Required</span></div>
</div>

<div class="card" style="margin-bottom:16px">
 <h2>3 Pre-Seeded Demonstration Cases (Ready to Explore)</h2>
 <p class="mu" style="margin-bottom:12px">Each demo case contains real forensic artifacts (ELA heatmaps, spectrograms, frame extracts) and pre-computed findings. Ground-truth labels are shown separately from analysis outputs.</p>
 <div class="grid g3">${demos.map(d=>`
  <div class="card" style="background:var(--s3)">
   <span class="pill demo">DEMO SAMPLE</span> <b style="margin-left:6px">${esc(d.id)}</b>
   <h2 style="margin:8px 0 4px;font-size:14px">${esc(d.title.replace('[DEMO] ',''))}</h2>
   <p class="mu" style="font-size:12px;margin:0 0 6px">${esc(d.description.slice(0,100))}…</p>
   <p style="margin:0 0 10px;font-size:12px">Media: ${(d.media||[]).join(', ')} · <span class="pill ${RS[d.review_status]?.cls||''}" style="font-size:10px">${RS[d.review_status]?.label||d.review_status}</span></p>
   <button class="btn p sm" onclick="openInv('${d.id}','evidence')">Open Evidence</button>
   <button class="btn sm" onclick="openInv('${d.id}','correlation');render()">Correlation</button>
   <button class="btn sm" onclick="S.inv='${d.id}';dl()">PDF Report</button>
  </div>`).join('')}
 </div>
</div>

<div class="card" style="margin-bottom:16px">
 <h2>Review Status Guide</h2>
 <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px">
  <span class="pill">analysis pending</span> → <span class="pill wa">needs review</span> → <span class="pill info">in progress</span> → <span class="pill ok">reviewed ✓</span>
 </div>
 <p class="mu" style="margin-top:8px;font-size:12px"><b>Not Reviewed</b> = analysis ran and produced findings; awaiting examiner action. It does NOT mean the file is manipulated or the analysis failed.</p>
</div>

<div class="card">
 <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
  <h2 style="margin:0">Recent Investigations</h2>
  <a class="btn sm" href="#new">+ New Investigation</a>
 </div>
 ${invTable(L.slice(0,8))}
</div>`}

// ── INVESTIGATION TABLE ───────────────────────────────────────────────────────
function invTable(rows){
 const rsCls={not_reviewed:'',not_started:'',needs_review:'wa',in_progress:'info',reviewed:'ok',failed:'er'};
 return `<div class="tw"><table><tr><th>Source</th><th>Case ID</th><th>Title</th><th>Created</th><th>Media</th><th>Analysis</th><th>Review Status</th><th>Actions</th></tr>${rows.map(r=>`<tr>
 <td>${r.is_demo?'<span class="pill demo">DEMO</span>':'<span class="pill ok">REAL-TIME</span>'}</td>
 <td><b>${r.id}</b></td>
 <td style="max-width:260px;overflow:hidden;text-overflow:ellipsis">${esc(r.title)}</td>
 <td>${(r.created_at||'').slice(0,10)}</td>
 <td>${(r.media||[]).join(', ')||'—'}</td>
 <td><span class="pill ${r.status==='completed'?'ok':r.status==='failed'?'er':'wa'}">${r.status}</span></td>
 <td><span class="pill ${rsCls[r.review_status]||''}">${(RS[r.review_status]?.label||r.review_status||'—').replace(/_/g,' ')}</span></td>
 <td>
  <button class="btn sm" onclick="openInv('${r.id}','${r.status==='completed'?'evidence':'progress'}')">Workspace</button>
  ${r.status==='completed'?`<button class="btn sm" onclick="S.inv='${r.id}';dl()">PDF</button>`:''}
 </td></tr>`).join('')||'<tr><td colspan=8 class="empty">No investigations found.</td></tr>'}</table></div>`}

// ── HISTORY ───────────────────────────────────────────────────────────────────
function history(){
 const h='<h1>Investigations Registry</h1><p class="mu">Browse pre-seeded demonstration datasets and real-time user-uploaded investigations.</p>';
 if(!S.list)return h+'<p class="mu">Loading…</p>';
 const q=(S.q||'').toLowerCase(),f=S.f||'',src=S.src||'';
 let rows=S.list.filter(r=>{
   const matchQ=(r.title+r.id+(r.case_ref||'')).toLowerCase().includes(q);
   const matchF=!f||r.status===f;
   const matchSrc=!src||(src==='demo'?r.is_demo:!r.is_demo);
   return matchQ&&matchF&&matchSrc;
 });
 rows=[...rows].sort((a,b)=>S.sk==='name'?a.title.localeCompare(b.title):b.created_at.localeCompare(a.created_at));
 const N=Math.max(1,Math.ceil(rows.length/8)),P=Math.min(S.p||0,N-1);
 return h+`
<div style="display:flex;gap:10px;margin:14px 0;flex-wrap:wrap">
 <input type="text" placeholder="Search by title, ID or case ref" value="${esc(S.q||'')}" oninput="S.q=this.value;S.p=0;render(1)" style="max-width:280px">
 <select class="btn" onchange="S.src=this.value;S.p=0;render()"><option value="">All Types</option><option value="real" ${src==='real'?'selected':''}>Live Real-Time</option><option value="demo" ${src==='demo'?'selected':''}>Demo Samples</option></select>
 <select class="btn" onchange="S.f=this.value;S.p=0;render()"><option value="">All Statuses</option><option value="completed" ${f==='completed'?'selected':''}>Completed</option><option value="processing" ${f==='processing'?'selected':''}>Processing</option><option value="failed" ${f==='failed'?'selected':''}>Failed</option></select>
 <select class="btn" onchange="S.sk=this.value;S.p=0;render()"><option value="date" ${S.sk==='date'?'selected':''}>Newest First</option><option value="name" ${S.sk==='name'?'selected':''}>Name A–Z</option></select>
</div>
<div class="card">${invTable(rows.slice(P*8,P*8+8))}</div>
<div style="display:flex;gap:10px;margin-top:12px;align-items:center">
 <button class="btn sm" ${P<=0?'disabled':''} onclick="S.p=${P-1};render()">Previous</button>
 <span class="mu" style="font-size:13px">Page ${P+1} of ${N} (${rows.length} total)</span>
 <button class="btn sm" ${P>=N-1?'disabled':''} onclick="S.p=${P+1};render()">Next</button>
</div>`}

// ── NEW INVESTIGATION ─────────────────────────────────────────────────────────
function newInv(){
 const n=Object.values(S.files).flat();
 const valid=n.length>0&&!Object.values(S.errs).some(Boolean)&&S.title;
 return `<h1>New Real-Time Investigation</h1><p class="mu">Files are streamed to your TruthLens backend, cryptographically hashed with SHA-256, and processed by real forensic engines.</p>
<div class="grid g2" style="margin-top:14px"><div class="card">
 <label for="ttl" style="margin-top:0">Investigation Title (required)</label>
 <input type="text" id="ttl" placeholder="e.g. Suspected Press Release Alteration" value="${esc(S.title||'')}" oninput="S.title=this.value;chk()">
 <label for="ds">Case Description</label>
 <textarea id="ds" rows="3" placeholder="Context, acquisition notes, chain of custody…" oninput="S.ds=this.value">${esc(S.ds||'')}</textarea>

 <input type="text" id="cr" placeholder="e.g. CR-2026-09" value="${esc(S.cr||'')}" oninput="S.cr=this.value">
 <label for="tr">Accompanying Script or Transcript (optional)</label>
 <textarea id="tr" rows="3" placeholder="Official text to compare against spoken audio…" oninput="S.tr=this.value">${esc(S.tr||'')}</textarea>
</div>
<div class="grid">${Object.keys(TYPES).map(k=>`<div class="drop" id="d-${k}" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="event.preventDefault();this.classList.remove('over');add('${k}',event.dataTransfer.files)">
 <b>${TYPES[k].l}</b> <span class="mu" style="font-size:12px">(${TYPES[k].ext.join(', ')})</span><br>
 <input type="file" multiple aria-label="Browse ${k} files" onchange="add('${k}',this.files);this.value=''" style="margin-top:8px;max-width:100%">
 ${S.files[k].map((f,i)=>`<div class="file"><span>${esc(f.name)}</span><span class="mu">${size(f.size)}</span><button class="btn sm" onclick="rm('${k}',${i})">Remove</button></div>`).join('')}
 ${S.errs[k]?`<div class="err">${S.errs[k]}</div>`:''}</div>`).join('')}</div></div>
<div class="card" style="margin-top:14px">
 <h2>Ingest & Evidence Integrity</h2>
 <p>${n.length} file(s) selected: ${Object.keys(TYPES).map(k=>k+' ('+S.files[k].length+')').join(' · ')}</p>
 <p class="mu">Each file is verified and hashed with SHA-256 on ingest. All detectors run within local resources or transparent fallbacks. No data is sent to external services unless Gemini API key is configured.</p>
 ${S.err?`<div class="err" style="margin-bottom:12px">${esc(S.err)}</div>`:''}
 <button class="btn p" id="go" ${valid?'':'disabled'} onclick="start()">${S.busy?'Uploading & Starting…':'Start Real-Time Analysis'}</button>
 ${!valid?'<span class="mu" style="margin-left:8px">Enter a title and select at least one file.</span>':''}
</div>`}

function chk(){const b=$('#go');if(b){const n=Object.values(S.files).flat().length;b.disabled=!(n&&S.title&&!Object.values(S.errs).some(Boolean))}}
function add(k,list){S.errs[k]='';[...list].forEach(f=>{const e=f.name.split('.').pop().toLowerCase();if(!TYPES[k].ext.includes(e))S.errs[k]=`"${esc(f.name)}" not supported. Allowed: ${TYPES[k].ext.join(', ')}`;else if(f.size>200e6)S.errs[k]=`"${esc(f.name)}" exceeds 200 MB limit.`;else S.files[k].push(f)});render()}
function rm(k,i){S.files[k].splice(i,1);if(!S.files[k].length)S.errs[k]='';render()}

function upload(fd){return new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open('POST',API_BASE+'/investigations');x.timeout=180000;x.upload.onprogress=e=>{if(e.lengthComputable){const b=$('#go');if(b)b.textContent='Uploading '+Math.round(e.loaded/e.total*100)+'%'}};x.onload=()=>{try{const j=JSON.parse(x.responseText);x.status<300?res(j):rej(new Error((j.detail)||'Upload failed ('+x.status+')'))}catch(_){rej(new Error('Unexpected backend response'))}};x.onerror=()=>rej(new Error('Cannot reach backend at '+API_BASE));x.ontimeout=()=>rej(new Error('Upload timed out'));x.send(fd)})}

async function start(){S.busy=true;S.err='';render();const fd=new FormData();fd.append('title',S.title);fd.append('description',S.ds||'');fd.append('case_ref',S.cr||'');fd.append('transcript',S.tr||'');Object.keys(S.files).forEach(k=>S.files[k].forEach(f=>fd.append(k,f)));
 try{const r=await upload(fd);S.inv=r.id;await api(`/investigations/${r.id}/analyze`,{method:'POST'});S.files={image:[],video:[],audio:[],text:[]};S.title=S.ds=S.cr=S.tr='';location.hash='progress';startPoll()}
 catch(e){S.err='Analysis did not start: '+e.message}S.busy=false;render()}

// Helper: get all findings for a modality+file, also searching demo seeded findings

function correlation(){
 if(!S.inv)return `<h1>Cross-Modal Correlation</h1><div class="card empty">Open an investigation first.<br><a class="btn p" href="#history" style="margin-top:10px;display:inline-block">Open Registry</a></div>`;
 if(!S.res)return `<h1>Cross-Modal Correlation: ${esc(S.inv)}</h1><p class="mu">Loading…</p>`;
 const cf=S.res.correlation?.findings||[];
 const corFindings=cf.filter(f=>f.provenance==='heuristic');
 const aiFindings=cf.filter(f=>f.provenance==='ai_explanation');
 const base=['image','video','audio','text'].flatMap(m=>S.res[m]?.findings||[]);
 const timed=base.filter(f=>f.timestamp_seconds!=null).sort((a,b)=>a.timestamp_seconds-b.timestamp_seconds);
 const C={image:'--mu',video:'--ac',audio:'--ac2',text:'--wa'};
 const groups={};
 timed.forEach(f=>{const k=Math.round(f.timestamp_seconds/0.5)*0.5;(groups[k]=groups[k]||[]).push(f)});
 const clusters=Object.entries(groups).filter(([,g])=>g.length>1).map(([t,g])=>({t:parseFloat(t),findings:g}));
 return `<h1>Cross-Modal Correlation: ${esc(S.inv)}</h1>
<p class="mu">Aligning observations across modalities within temporal proximity windows. No combined authenticity score is manufactured.</p>
${reviewBanner()}
${clusters.length?`<div class="card" style="margin:16px 0;border-left:3px solid var(--wa)">
 <h2>⚠️ Temporal Clusters Detected: ${clusters.length} Convergence Window(s)</h2>
 ${clusters.map(c=>`<p style="margin:6px 0"><b>${fmt(c.t)}</b> — ${c.findings.length} modalities converge: ${c.findings.map(f=>`<span class="tag" style="--c:var(${C[f.modality]||'--ac'})">${f.modality.toUpperCase()}</span>`).join('')}</p>`).join('')}
 <p class="mu" style="font-size:12px;margin-top:8px">Temporal clusters indicate concurrent signals. This is a prompt for examiner investigation, not proof of manipulation.</p>
</div>`:''}

<div class="card" style="margin:16px 0">
 <h2>Unified Chronological Timeline</h2>
 ${timed.length?`<div class="tl">${timed.map(e=>`<div class="ev" style="--c:var(${C[e.modality]||'--ac'})"><time>${fmt(e.timestamp_seconds)}</time><span class="tag" style="--c:var(${C[e.modality]||'--ac'})">${e.modality.toUpperCase()}</span><b>${esc(e.title)}</b><p class="mu" style="margin:4px 0 0;font-size:12px">${esc(e.description)}</p></div>`).join('')}</div>`:'<p class="mu">No timestamped observations in this investigation.</p>'}
</div>

<div class="card" style="margin-bottom:16px">
 <h2>Evidence Relationship Graph</h2>
 <div class="tw"><svg viewBox="0 0 700 200" style="min-width:480px;width:100%" role="group" aria-label="Relationship graph">
  ${timed.length>=2?`<line x1="140" y1="90" x2="560" y2="90" stroke="var(--ac)" stroke-width="1.5" stroke-dasharray="6,4"/>`:''}
  ${['image','video','audio','text'].map((m,i)=>{const x=90+i*160;const hasM=timed.some(f=>f.modality===m);return hasM?`<g><rect x="${x-70}" y="68" width="140" height="44" rx="6" fill="var(--s3)" stroke="var(--${['mu','ac','ac2','wa'][i]})" stroke-width="2"/><text x="${x}" y="88" text-anchor="middle" fill="var(--tx)" font-size="12">${m.charAt(0).toUpperCase()+m.slice(1)}</text><text x="${x}" y="104" text-anchor="middle" fill="var(--${['mu','ac','ac2','wa'][i]})" font-size="10">${timed.filter(f=>f.modality===m).length} finding(s)</text></g>`:''}).join('')}
 </svg></div>
 <p class="mu" style="font-size:12px;margin:6px 0 0">Connected nodes share temporal proximity. Solid lines indicate findings within 0.5s of each other.</p>
</div>

${corFindings.map(g=>`<div class="card" style="margin-bottom:12px;border-left:3px solid var(--ac)">${fc(g)}</div>`).join('')}
${aiFindings.map(g=>fc(g)).join('')}
<p style="margin-top:16px"><a class="btn p" href="#report">Generate & Download Report</a></p>`}

// ── REPORT ────────────────────────────────────────────────────────────────────
function report(){
 if(!S.inv)return `<h1>Forensic Report</h1><div class="card empty">Select an investigation to download its report.<br><a class="btn p" href="#history" style="margin-top:10px;display:inline-block">Open Registry</a></div>`;
 const inv=S.list&&S.list.find(i=>i.id===S.inv);
 return `<h1>Forensic Report: ${esc(S.inv)}</h1>
<p class="mu">Official ReportLab PDF dossier compiling SHA-256 evidence chain of custody, methodology status, findings, and model governance.</p>
${reviewBanner()}
<div class="card" style="margin:16px 0">
 <h2>Report Contents</h2>
 <ul class="mu" style="line-height:1.9">
  <li>Cryptographic Evidence Chain: SHA-256 digests, file sizes, and ingest timestamps</li>
  <li>Pipeline Execution: Individual status of Image, Video, Audio, Text, and Correlation agents</li>
  <li>Raw Detector Metrics: Independent scores (no merged percentages)</li>
  <li>Candidate Model Governance: Full registry of evaluated models, licenses, and fallback states</li>
  <li>Examiner Review Status: Per-finding review decisions and case-level sign-off</li>
  <li>Alternative Benign Explanations: Mandatory on every heuristic finding</li>
 </ul>
</div>
${inv&&inv.review_status!=='reviewed'?`<div class="card" style="margin-bottom:16px;border-left:3px solid var(--wa)">
 <b>⚠️ Report Not Yet Signed Off</b>
 <p class="mu" style="margin:6px 0 0">Current review status: <span class="pill wa">${RS[inv.review_status]?.label||inv.review_status}</span>. Consider completing the examiner review workflow before submitting this report as formal evidence.</p>
</div>`:''}
<div style="display:flex;gap:10px;flex-wrap:wrap">
 <button class="btn p" onclick="dl()">⬇ Download PDF Report</button>
 <button class="btn" onclick="print()">Print Preview</button>
 <a class="btn" href="#evidence">Return to Evidence</a>
</div>`}

// ── REGISTRY ──────────────────────────────────────────────────────────────────

 const R=S.registry||[];
 return `<h1>Candidate Model & Repository Registry</h1>
<p class="mu">Before integrating candidate tools, TruthLens evaluates each across 8 governance criteria: license, hardware, weight availability, turnaround (&lt;24h), media compatibility, source, version, and transparent fallback.</p>
<div class="card" style="margin-top:14px"><div class="tw"><table>
<tr><th>Candidate</th><th>Category</th><th>License</th><th>Hardware</th><th>Integration & Fallback</th></tr>
${R.map(m=>`<tr>
 <td><b>${esc(m.name)}</b><br><span class="mu" style="font-size:11px">${esc(m.version_source)}</span></td>
 <td><span class="pill info">${esc(m.category)}</span></td>
 <td>${esc(m.license)}</td>
 <td>${esc(m.hardware_requirements)}</td>
 <td><span class="pill ${m.integration_status.includes('Active')?'ok':'demo'}">${m.integration_status.includes('Active')?'ACTIVE':'EVALUATED FALLBACK'}</span><br><span class="mu" style="font-size:12px">${esc(m.notes)}</span></td>
</tr>`).join('')||'<tr><td colspan=5 class="empty">Loading model registry…</td></tr>'}
</table></div></div>`}

// ── SETTINGS ──────────────────────────────────────────────────────────────────
function settings(){
 const h=S.health?.services||{};
 return `<h1>Platform Settings & Connection</h1><p class="mu">Backend configuration and candidate service diagnostics.</p>
<div class="grid g2" style="margin-top:14px">
 <div class="card">
  <h2>API Connection</h2>
  <p>Endpoint: <code>${esc(API_BASE)}</code></p>
  <span class="pill ${S.conn==='ok'?'ok':'er'}">${S.conn==='ok'?'Connected':'Offline'}</span>
  <button class="btn sm" onclick="ping()" style="margin-left:8px">Test Health</button>
 </div>
 <div class="card">
  <h2>Service Health</h2>
  <div style="margin-top:8px;font-size:13px">
   <p style="margin:4px 0">FFmpeg / FFprobe: <span class="pill ${h.ffmpeg?'ok':'er'}">${h.ffmpeg?'ACTIVE':'UNAVAILABLE'}</span></p>
   <p style="margin:4px 0">OpenCV Vision: <span class="pill ${h.opencv?'ok':'er'}">${h.opencv?'AVAILABLE':'STANDBY'}</span></p>
   <p style="margin:4px 0">Librosa DSP: <span class="pill ${h.librosa?'ok':'er'}">${h.librosa?'ACTIVE':'UNAVAILABLE'}</span></p>
   <p style="margin:4px 0">Faster-Whisper int8: <span class="pill ${h.faster_whisper?'ok':'er'}">${h.faster_whisper?'ACTIVE':'UNAVAILABLE'}</span></p>
   <p style="margin:4px 0">Gemini AI: <span class="pill ${h.gemini_enabled?'ok':'demo'}">${h.gemini_enabled?'ENABLED':'CONFIGURABLE — add GEMINI_API_KEY'}</span></p>
   <p style="margin:4px 0">Supabase: <span class="pill ${h.supabase_connected?'ok':'demo'}">${h.supabase_connected?'CONNECTED':'SQLITE FALLBACK (add SUPABASE_URL)'}</span></p>
  </div>
 </div>
 <div class="card">
  <h2>Review Workflow Guide</h2>
  <p class="mu" style="font-size:13px">The review system has 5 states:</p>
  <ol class="mu" style="font-size:13px;line-height:1.9;padding-left:18px">
   <li><b>Analysis Pending</b> — file uploaded, analysis not yet run</li>
   <li><b>Analysis Complete / Needs Review</b> — findings produced, awaiting examiner</li>

  <p class="mu" style="font-size:12px;margin-top:8px">Set in <code>truthlens/backend/.env</code> or Docker environment. Restart container after changes.</p>

// ── ROUTER ────────────────────────────────────────────────────────────────────
const PAGES={home:landing,overview,new:newInv,history,progress,evidence,correlation,report,registry,settings};

function render(keep){
 const r=route(),pg=PAGES[r]||landing;
 let focus=document.activeElement,id=focus&&focus.id,pos=focus&&focus.selectionStart;
 const body=pg();
 if(r==='home'){$('#root').innerHTML=body;return}
 $('#root').innerHTML=`<div class="app"><aside class="${S.collapsed?'c':''} ${S.open?'open':''}" aria-label="Main Navigation">
  <div class="logo"><i></i><span class="lb">TRUTHLENS</span></div>
  <nav class="nav">${NAV.map(n=>`<a href="#${n[0]}" class="${r===n[0]?'on':''}" onclick="S.open=false"><span>•</span><span class="lb">${n[1]}</span></a>`).join('')}</nav>
 </aside>
 <main><header class="top">
  <button class="btn" aria-label="Toggle sidebar" onclick="innerWidth<761?S.open=!S.open:S.collapsed=!S.collapsed;render()">☰</button>
  <span class="pill ${S.conn==='ok'?'ok':'er'}">${S.conn==='ok'?'Backend Active':'Backend Offline'}</span>
  <span class="pill demo">3 DEMO SAMPLES</span>
  <span class="pill ok">REAL-TIME ENABLED</span>
  <span class="sp"></span>
  ${S.inv?`<span class="mu" style="font-size:12px">Active: <b>${esc(S.inv)}</b></span>`:''}
  <a class="btn p sm" href="#new">+ New Investigation</a>
 </header><div class="pg">${body}</div></main></div>
 ${S.toast?`<div role="status" aria-live="polite" style="position:fixed;bottom:20px;right:20px;background:var(--s3);padding:10px 14px;border-radius:6px;border:1px solid var(--bd);box-shadow:0 4px 12px rgba(0,0,0,.4);z-index:99">${esc(S.toast)}</div>`:''}`;
 if(keep&&id){const e=document.getElementById(id)||document.querySelector('input[type=text]');if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch(_){}}}}

addEventListener('hashchange',()=>{stopPoll();render();onRoute();scrollTo(0,0)});
render();ping();
</script></body></html>
